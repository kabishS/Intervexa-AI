<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intervexa AI - Login</title>

    <link rel="stylesheet" href="css/index.css">

</head>

<body>
    <div class="container">

        <div class="left">
            <div class="logo">🎤</div>

            <h1>Intervexa AI</h1>
            <p>
                Practice interviews, improve your skills,
                and get AI-powered feedback.
            </p>
        </div>

        <div class="right">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to continue your interview journey.
                </p>

                <form id="loginForm">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="login-button" href="html/home.html">Login</button>

                </form>

                <p class="bottom-text">
                    Don't have an account?
                    <a href="#">Create Account</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/index.js"></script>

</body>
</html>
